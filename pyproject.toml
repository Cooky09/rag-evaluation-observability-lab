[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-observability-lab"
version = "0.1.0"
description = "Local RAG evaluation, GPU benchmarking, and observability platform"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]